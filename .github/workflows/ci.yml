name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # Tests use PGlite (in-memory Postgres), so no database service is needed.
      - name: Test
        run: pnpm test

      # Search-quality regression guard with the local fake embedder (no API key in CI).
      # Fails on any permission leak, or if hybrid Recall@10 drops below the floor.
      - name: Search eval
        run: pnpm --filter backend eval --fake --min-recall=0.85

      - name: Build
        run: pnpm build
